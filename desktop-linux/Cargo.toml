[package]
name = "zerowire-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "zerowire Linux receiver — CLI walking skeleton."
default-run = "zerowire-cli"

[[bin]]
name = "zerowire-cli"
path = "src/main.rs"

[dependencies]
zerowire-protocol = { path = "../protocol" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
mdns-sd = "0.11"
serde_json = "1"
log = "0.4"
env_logger = "0.11"
