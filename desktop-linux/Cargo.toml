[package]
name = "zerowire-cli"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "zerowire Linux receiver — CLI + HID fast-lane."
default-run = "zerowire-cli"

[lib]
name = "zerowire_cli"
path = "src/lib.rs"

[[bin]]
name = "zerowire-cli"
path = "src/bin/zerowire_cli.rs"

[[bin]]
name = "zerowire-mock-sender"
path = "src/bin/mock_sender.rs"

[[bin]]
name = "zerowire-linux-sender"
path = "src/bin/linux_sender.rs"

[dependencies]
zerowire-protocol = { path = "../protocol" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
mdns-sd = "0.11"
serde_json = "1"
log = "0.4"
env_logger = "0.11"
libc = "0.2"

