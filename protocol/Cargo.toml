[package]
name = "zerowire-protocol"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared wire-protocol definitions for zerowire (USB/IP + HID fast lane + PSK)."
repository = "https://github.com/builtbyzero/zerowire"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hkdf = "0.12"
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"
